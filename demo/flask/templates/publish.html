<!DOCTYPE html>
<link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='publish.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<body>
    <main>
        <div class="result-wrapper publish">
            <div class="video-frame">
                <div class="video-header">
                    <span class="badge">Generated Video</span>
                </div>
                <video class="main-video" controls>
                    <source src="{{ video_url }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="description-frame">
                <div class="video-header">
                    <span class="badge">Generated Description</span>
                </div>
                <p id="post-description">{{ post_description }}</p>
            </div>
        </div>

        <div class="publish-container">
            <h1 class="header">Select platforms to publish</h1>
            <div class="checkbox-group">
                <input type="checkbox" id="bsky" name="socials" value="bsky" class="hidden-toggle">
                <label for="bsky" class="platform-btn">Upload to Bluesky</label>

                <input type="checkbox" id="youtube" name="socials" value="youtube" class="hidden-toggle">
                <label for="youtube" class="platform-btn">Upload to YouTube</label>
            </div>
            <input type="hidden" id="thread-id" value="{{ thread_id }}">
            <button id="publish-btn" class="button">Publish &rarr;</button>
            <p id="publish-status" style="margin-top: 1rem; font-size: 0.9rem; color: #aeb0cf; display: none;"></p>
        </div>
    </main>
</body>
<script>
    document.getElementById('publish-btn').addEventListener('click', async () => {
        const publishBtn = document.getElementById('publish-btn');
        const statusText = document.getElementById('publish-status');
        const threadId = document.getElementById('thread-id').value;
        
        const checkboxes = document.querySelectorAll('input[name="socials"]:checked');
        const selectedSocials = Array.from(checkboxes).map(cb => cb.value);

        if (selectedSocials.length === 0) {
            alert("Please select at least one platform.");
            return;
        }

        publishBtn.disabled = true;
        publishBtn.innerText = "Publishing...";
        statusText.style.display = "block";
        statusText.innerText = "Connecting to platforms and uploading...";

        try {
            const response = await fetch('/publish/content', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    thread_id: threadId,
                    socials: selectedSocials
                })
            });

            const data = await response.json();

            if (data.status === 'success') {
                publishBtn.innerText = "Published!";
                statusText.style.color = "#56C8FF";
                statusText.innerHTML = `Success! View your post: <a href="${data.urls.bsky_post_url}" target="_blank" style="color: #E06F65;">Link</a>`;
            } else {
                throw new Error(data.error || "Unknown error");
            }

        } catch (error) {
            console.error(error);
            publishBtn.disabled = false;
            publishBtn.innerText = "Publish Video";
            statusText.style.color = "#E06F65";
            statusText.innerText = "Error: " + error.message;
        }
    });
</script>
